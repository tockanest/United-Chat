<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Background circle -->
    <circle cx="256" cy="256" r="250" fill="#1a1a1a"/>

    <!-- Chat bubble elements representing Twitch (left) and YouTube (right) -->
    <path d="M180 180 Q140 180 140 220 L140 300 Q140 340 180 340 L220 340 L240 380 L260 340 L300 340 Q340 340 340 300 L340 220 Q340 180 300 180 Z"
          fill="#9146FF"/> <!-- Twitch purple -->

    <path d="M200 160 Q160 160 160 200 L160 280 Q160 320 200 320 L240 320 L260 360 L280 320 L320 320 Q360 320 360 280 L360 200 Q360 160 320 160 Z"
          fill="#FF0000"/> <!-- YouTube red -->

    <!-- Unity symbol (connecting ring) -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="white" stroke-width="24" stroke-dasharray="20,10"/>

    <!-- Central icon representing chat unification -->
    <path d="M256 196 L286 256 L256 316 L226 256 Z" fill="white"/>

    <!-- Decorative dots -->
    <circle cx="206" cy="256" r="8" fill="white"/>
    <circle cx="306" cy="256" r="8" fill="white"/>
</svg>